version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/www"
    schedule:
      interval: "weekly"
    ignore:
      # Ignore the file-based dependency since it's locally built
      - dependency-name: "cddl"
  - package-ecosystem: "npm"
    directory: "/cddl-lsp"
    schedule:
      interval: "weekly"
    ignore:
      # typescript-eslint only supports typescript <6.1.0, so major bumps of
      # typescript break `npm install` with an ERESOLVE peer dependency conflict
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/cddl-lsp/client"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/cddl-lsp/server"
    schedule:
      interval: "weekly"