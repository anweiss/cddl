name: Dependency and secret checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '25 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install locked manifests
        run: |
          npm ci
          npm --prefix www ci
          npm --prefix cddl-lsp ci
          npm --prefix cddl-lsp/client ci
          npm --prefix cddl-lsp/server ci
      - name: Install Rust dependency scanners
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      - name: Scan npm and Rust dependencies
        run: |
          npm audit
          npm --prefix www audit
          npm --prefix cddl-lsp audit
          npm --prefix cddl-lsp/client audit
          npm --prefix cddl-lsp/server audit
          cargo audit
          cargo machete
      - name: Scan current source for secrets
        # Pinned image runs locally in CI; it does not upload source to a service.
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner --config /repo/.gitleaks.toml
