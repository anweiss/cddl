on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/anchore-analysis.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'src/**'
      - 'tests/**'
      - 'cddl-codegen-rust/**'
      - 'cddl-derive/**'
  pull_request:

name: Build and Test
permissions:
  contents: read
  pull-requests: write

jobs:
  minimum-version-check:
    strategy:
      matrix:
        rust_toolchain: [1.88.0]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    name: msrv check
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update
          rustup install ${{ matrix.rust_toolchain }}

      - name: Check compilation with default features
        run: |
          cargo +${{ matrix.rust_toolchain }} check --locked --all --bins --examples --tests

      - name: Check standalone derive consumer
        run: cargo +${{ matrix.rust_toolchain }} check --locked --tests --manifest-path cddl-derive/tests/consumer/Cargo.toml

      - name: Install thumbv7em-none-eabihf target
        run: rustup target add thumbv7em-none-eabihf --toolchain ${{ matrix.rust_toolchain }}

      - name: Check compilation with no features
        run: |
          cargo +${{ matrix.rust_toolchain }} check --locked -p cddl --lib --no-default-features --features _build-parser --target thumbv7em-none-eabihf

      - name: Check compilation with no default features (modules)
        run: |
          cargo +${{ matrix.rust_toolchain }} check --locked -p cddl --lib --no-default-features --features modules,_build-parser --target thumbv7em-none-eabihf

      - name: Check compilation with no default features (ast-span)
        run: |
          cargo +${{ matrix.rust_toolchain }} check --locked -p cddl --lib --no-default-features --features ast-span,_build-parser --target thumbv7em-none-eabihf

  compilation-check:
    uses: ./.github/workflows/compilation-check.yml

  wasm-compilation-check:
    strategy:
      matrix:
        rust_toolchain: [stable]
    name: Compilation check for wasm target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update
          rustup install ${{ matrix.rust_toolchain }}
          rustup target add wasm32-unknown-unknown

      - name: Check compilation for wasm target
        run: |
          cargo +${{ matrix.rust_toolchain }} check -p cddl -p cddl-codegen-rust --lib --target wasm32-unknown-unknown

      - name: Check compilation for wasm target (modules)
        run: |
          cargo +${{ matrix.rust_toolchain }} check -p cddl --lib --target wasm32-unknown-unknown --features modules

  test-suite:
    strategy:
      matrix:
        rust_toolchain: [stable]
        os: [ubuntu-latest, windows-latest]
    name: Test suite
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update
          rustup install ${{ matrix.rust_toolchain }}
          rustup target add wasm32-unknown-unknown

      - name: cargo +${{ matrix.rust_toolchain }} test ${{ matrix.os }}
        run: |
          cargo +${{ matrix.rust_toolchain }} test --all -- --nocapture

      - name: cargo +${{ matrix.rust_toolchain }} test ${{ matrix.os }} (modules)
        # Scoped to -p cddl: under `--all`, cddl-derive's proc-macro
        # dependency on cddl is built without `modules` while the workspace
        # build enables it, and resolver v2 keeps those feature sets separate.
        # The two builds then collide on the unhashed `libcddl.so` name of the
        # cdylib target and the link fails.
        run: |
          cargo +${{ matrix.rust_toolchain }} test -p cddl --features modules -- --nocapture

      - name: Test standalone derive consumer
        run: cargo +${{ matrix.rust_toolchain }} test --locked --manifest-path cddl-derive/tests/consumer/Cargo.toml

  wasm-test-suite:
    name: wasm test suite
    runs-on: ubuntu-latest
    if: contains(github.ref, 'vscode-extension') != true
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup update
          rustup target add wasm32-unknown-unknown

      - name: Install wasmpack
        run: |
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: Build wasm
        run: |
          wasm-pack test --node -- --test wasm

      - name: Test wasm library regressions
        run: wasm-pack test --node -- --lib

      - name: Test JSON-only wasm library regressions
        run: wasm-pack test --node -- --no-default-features --features json --lib

      - name: Test wasm module resolution
        run: wasm-pack test --node -- --features modules --test wasm

  style-linting:
    strategy:
      matrix:
        rust_toolchain: [stable]
    name: Style linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update
          rustup install ${{ matrix.rust_toolchain }}
          rustup component add rustfmt clippy

      - name: cargo +${{ matrix.rust_toolchain }} fmt
        if: ${{ always() }}
        run: |
          cargo +${{ matrix.rust_toolchain }} fmt --all -- --check

      - name: cargo +${{ matrix.rust_toolchain }} clippy
        if: ${{ always() }}
        run: |
          cargo +${{ matrix.rust_toolchain }} clippy --all

  wasm-style-linting:
    strategy:
      matrix:
        rust_toolchain: [stable]
    name: wasm style linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update
          rustup install ${{ matrix.rust_toolchain }}
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy

      - name: cargo +${{ matrix.rust_toolchain }} clippy
        if: ${{ always() }}
        run: |
          cargo +${{ matrix.rust_toolchain }} clippy -p cddl -p cddl-codegen-rust --lib --target wasm32-unknown-unknown
