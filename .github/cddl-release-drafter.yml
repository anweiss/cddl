name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# Pre-1.0 policy: breaking changes require a minor draft; revisit in #712 before 1.0.
version-resolver:
  minor:
    labels:
      - 'breaking-change'
  default: patch
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## What's Changed

  This release contains updates to the main CDDL library and tools.

  $CHANGES

  ## Full Changelog

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
  - title: '📖 Documentation'
    labels:
      - 'documentation'
exclude-labels:
  - 'skip-changelog'
  - 'vscode-extension'
include-paths:
  - 'src'
  - 'tests'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'cddl.pest'
